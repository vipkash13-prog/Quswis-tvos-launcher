name: Live TV Center Preview
on:
  push:
    branches: ["feature/live-tv-center"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original launcher, news, prayer and match files
        run: sha256sum -c tests/live-tv-protected.sha256
      - name: Install SDK and build native Media3 app and tests
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle -p live-tv-build --no-daemon assembleDebug assembleDebugAndroidTest
          mkdir -p dist
          cp live-tv-build/build/outputs/apk/debug/*.apk dist/Quswis-tvOS-Launcher.apk
          cp live-tv-build/build/outputs/apk/androidTest/debug/*.apk /tmp/quswis-live-tv-test.apk
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose dist/Quswis-tvOS-Launcher.apk
          python3 tests/verify-live-manifest.py
      - name: Verify data parsers and original behavior policies
        run: |
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/quswis-json.jar
          mkdir -p /tmp/quswis-tests
          python3 - <<'PYTEST'
          from pathlib import Path
          source=Path('src/com/techgenius/tvoslauncher/PrayerTimes.java').read_text()
          Path('/tmp/quswis-tests/PrayerPanelClock.java').write_text('package com.techgenius.tvoslauncher;\n'+source[source.index('final class PrayerPanelClock {'):])
          PYTEST
          CLASSES=live-tv-build/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          javac -encoding UTF-8 -cp /tmp/quswis-json.jar:$CLASSES -d /tmp/quswis-tests src/com/techgenius/tvoslauncher/PrayerPlan.java /tmp/quswis-tests/PrayerPanelClock.java tests/PrayerPlanTest.java tests/PrayerPanelClockTest.java src/com/techgenius/tvoslauncher/PrayerFocusNavigation.java tests/PrayerFocusNavigationTest.java src/com/techgenius/tvoslauncher/FootballData.java tests/FootballDataTest.java src/com/techgenius/tvoslauncher/MatchCenterData.java tests/MatchCenterDataTest.java src/com/techgenius/tvoslauncher/GlobalNewsData.java tests/GlobalNewsDataTest.java src/com/techgenius/tvoslauncher/LiveTvData.java tests/LiveTvDataTest.java
          for TEST_NAME in PrayerPlanTest PrayerPanelClockTest PrayerFocusNavigationTest FootballDataTest MatchCenterDataTest; do java -cp /tmp/quswis-tests:/tmp/quswis-json.jar:$CLASSES com.techgenius.tvoslauncher.$TEST_NAME; done
          java -cp /tmp/quswis-tests:/tmp/quswis-json.jar:$CLASSES com.techgenius.tvoslauncher.GlobalNewsDataTest tests/global-news-fixtures/*.xml
          java -cp /tmp/quswis-tests:/tmp/quswis-json.jar:$CLASSES com.techgenius.tvoslauncher.LiveTvDataTest tests/live-tv-fixtures/*.m3u
          sudo chmod 666 /dev/kvm
      - name: Real broadcast, remote, fullscreen, search and persistence on Android 14
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell wm size 1920x1080
            adb install -r dist/Quswis-tvOS-Launcher.apk
            adb install -r -t /tmp/quswis-live-tv-test.apk
            timeout 420 adb shell am instrument -w -r com.techgenius.tvoslauncher.test/com.techgenius.tvoslauncher.LiveTvInstrumentation | tee /tmp/live-tv-1080.txt
            adb logcat -d -t 500 > dist/live-tv-logcat-1080.txt
            rg -n -A32 -B3 "FATAL EXCEPTION|Fatal signal" dist/live-tv-logcat-1080.txt || true
            adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/live-tv-window.png dist/live-tv-1080.png
            adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/live-tv-fullscreen.png dist/live-tv-fullscreen-1080.png
            grep -q LIVE_TV_UI_OK /tmp/live-tv-1080.txt
            adb shell am force-stop com.techgenius.tvoslauncher
            adb shell wm size 3840x2160
            timeout 360 adb shell am instrument -w -r -e persisted true com.techgenius.tvoslauncher.test/com.techgenius.tvoslauncher.LiveTvInstrumentation | tee /tmp/live-tv-4k.txt
            adb logcat -d -t 500 > dist/live-tv-logcat-4k.txt
            rg -n -A32 -B3 "FATAL EXCEPTION|Fatal signal" dist/live-tv-logcat-4k.txt || true
            adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/live-tv-window.png dist/live-tv-4k.png
            adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/live-tv-fullscreen.png dist/live-tv-fullscreen-4k.png
            grep -q LIVE_TV_UI_OK /tmp/live-tv-4k.txt
            adb shell am force-stop com.techgenius.tvoslauncher
            adb shell wm size 1920x1080
            adb shell svc wifi disable
            adb shell svc data disable
            timeout 150 adb shell am instrument -w -r -e offline true -e persisted true com.techgenius.tvoslauncher.test/com.techgenius.tvoslauncher.LiveTvInstrumentation | tee /tmp/live-tv-offline.txt
            adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/live-tv-offline.png dist/live-tv-offline.png
            grep -q LIVE_TV_UI_OK /tmp/live-tv-offline.txt
      - name: Upload APK, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-preview-${{ github.run_attempt }}
          path: dist/*
      - name: Publish direct APK and actual native previews
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-tv-v1.0.205-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Live TV Center - 1.0.205 preview ${{ github.run_number }}
          body: |
            مركز البث المباشر بسبعة أقسام في فرع مستقل؛ لا دمج في main.
            قوائم iptv-org العامة وبيانات قنوات ولغات حقيقية، Media3 ExoPlayer داخلي، بحث عربي/إنجليزي، مفضلة وآخر قناة، وXMLTV اختياري.
            البث غير مضمون قبل فك ترميز فيديو فعلي. لا تجاوز DRM ولا اشتراكات beIN/OSN؛ قسم الكرتون العربي لا يعتمد على اسم القناة أو بلدها وحدهما.
            اختبارات Android 14 بدقتي 1080p و4K، تشغيل قناة عامة فعلية، خطأ بث متعمد للاختبار فقط، ملء الشاشة والريموت والحفظ دون اتصال، وحماية الملفات الأصلية.
            APK تجريبي بتوقيع تطوير؛ قد لا يثبت فوق نسخة موقعة بمفتاح مختلف.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/Quswis-tvOS-Launcher.apk
            dist/live-tv-1080.png
            dist/live-tv-4k.png
            dist/live-tv-fullscreen-1080.png
            dist/live-tv-fullscreen-4k.png
            dist/live-tv-offline.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
