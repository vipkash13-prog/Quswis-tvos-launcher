name: Android CI
# CI includes the isolated Xtream LIVE-only 1.0.206 validation branch.
# Build script fetches Media3 AAR class jars, AndroidX annotations, and Guava for the standalone javac/D8 pipeline; D8 receives each classpath jar separately, using Media3 1.4.1 and avoiding duplicate Guava ListenableFuture classes.

on:
  push:
    branches: [ "main", "test-scene-glass-lens", "feature-classic-prayer-adhan", "feature/prayer-glass-window", "work/xtream-live-integration" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # This project has no Gradle build: build.sh compiles it with the plain Android SDK tools.
    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Prepare original OUSWIS artwork
      run: |
        mkdir -p res/drawable
        curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/vipkash13-prog/Quswis-tvos-launcher/fc5e990fb6c9ef48e1513fe31355a102c69029bb/assets/app-logos/ouswis-app-icon.png" -o /tmp/ouswis-original.png
        cp /tmp/ouswis-original.png res/drawable/ouswis_app_icon.png
        python3 -m pip install --quiet Pillow
        python3 - <<'PY'
        from PIL import Image
        im=Image.open('/tmp/ouswis-original.png').convert('RGBA')
        canvas=Image.new('RGBA',(320,180),(20,23,34,255))
        icon=im.resize((152,152),Image.Resampling.LANCZOS)
        canvas.alpha_composite(icon,(84,14))
        canvas.convert('RGB').save('res/drawable/ouswis_tv_banner.png')
        PY

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > /tmp/quswis-release.keystore
        export RELEASE_KEYSTORE=/tmp/quswis-release.keystore
        test -s "$RELEASE_KEYSTORE"
        chmod +x build.sh
        VERSION_NAME="1.0.213" VERSION_CODE="213" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk

    - name: Upload APK artifact immediately
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher-1.0.213
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Verify prayer regressions and APK signature
      run: |
        curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/quswis-json.jar
        mkdir -p /tmp/quswis-prayer-tests
        python3 - <<'PYTEST'
        from pathlib import Path
        source = Path('src/com/techgenius/tvoslauncher/PrayerTimes.java').read_text()
        clock = source[source.index('final class PrayerPanelClock {'):]
        Path('/tmp/quswis-prayer-tests/PrayerPanelClock.java').write_text('package com.techgenius.tvoslauncher;\n' + clock)
        PYTEST
        javac -encoding UTF-8 -cp /tmp/quswis-json.jar -d /tmp/quswis-prayer-tests src/com/techgenius/tvoslauncher/PrayerPlan.java /tmp/quswis-prayer-tests/PrayerPanelClock.java tests/PrayerPlanTest.java tests/PrayerPanelClockTest.java src/com/techgenius/tvoslauncher/PrayerFocusNavigation.java tests/PrayerFocusNavigationTest.java
        java -cp /tmp/quswis-prayer-tests:/tmp/quswis-json.jar com.techgenius.tvoslauncher.PrayerPlanTest
        java -cp /tmp/quswis-prayer-tests:/tmp/quswis-json.jar com.techgenius.tvoslauncher.PrayerPanelClockTest
        java -cp /tmp/quswis-prayer-tests com.techgenius.tvoslauncher.PrayerFocusNavigationTest
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        "$SDK/build-tools/34.0.0/apksigner" verify --verbose dist/Quswis-tvOS-Launcher.apk

    - name: Build native remote smoke test
      env:
        RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > /tmp/quswis-release.keystore
        export RELEASE_KEYSTORE=/tmp/quswis-release.keystore
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        JAR="$SDK/platforms/android-34/android.jar"
        BT="$SDK/build-tools/34.0.0"
        mkdir -p /tmp/quswis-ui/classes /tmp/quswis-ui/dex
        "$BT/aapt2" link -o /tmp/quswis-ui/unsigned.apk -I "$JAR" --manifest tests/prayer-window-test-manifest.xml --min-sdk-version 24 --target-sdk-version 34
        javac -encoding UTF-8 --release 11 -cp "$JAR:build/classes" -d /tmp/quswis-ui/classes tests/PrayerWindowInstrumentation.java
        jar cf /tmp/quswis-ui/app-classes.jar -C build/classes .
        "$BT/d8" --min-api 24 --lib "$JAR" --classpath /tmp/quswis-ui/app-classes.jar --output /tmp/quswis-ui/dex /tmp/quswis-ui/classes/com/techgenius/tvoslauncher/PrayerWindowInstrumentation.class
        (cd /tmp/quswis-ui/dex && zip -q ../unsigned.apk classes.dex)
        "$BT/zipalign" -f 4 /tmp/quswis-ui/unsigned.apk /tmp/quswis-ui/aligned.apk
        "$BT/apksigner" sign --ks "$RELEASE_KEYSTORE" --ks-pass env:RELEASE_KEYSTORE_PASS --ks-key-alias "${RELEASE_KEY_ALIAS:-tvos-release}" --out /tmp/quswis-ui/test.apk /tmp/quswis-ui/aligned.apk
        sudo chmod 666 /dev/kvm

    - name: Test remote navigation on Android 14 and capture window
      timeout-minutes: 14
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: tv_1080p
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
        script: |
          adb shell wm size 1920x1080
          adb install -r dist/Quswis-tvOS-Launcher.apk
          adb install -r /tmp/quswis-ui/test.apk
          timeout 120 adb shell am instrument -w -r com.techgenius.tvoslauncher.windowtest/com.techgenius.tvoslauncher.PrayerWindowInstrumentation | tee /tmp/quswis-ui/result.txt
          adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/prayer-window-1080.png dist/prayer-window-1080.png
          grep -q PRAYER_UI_OK /tmp/quswis-ui/result.txt
          adb shell am force-stop com.techgenius.tvoslauncher
          adb shell wm size 3840x2160
          timeout 150 adb shell am instrument -w -r com.techgenius.tvoslauncher.windowtest/com.techgenius.tvoslauncher.PrayerWindowInstrumentation | tee /tmp/quswis-ui/result-4k.txt
          adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/prayer-window-1080.png dist/prayer-window-4k.png
          grep -q PRAYER_UI_OK /tmp/quswis-ui/result-4k.txt

    - name: Upload native window screenshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Prayer-window-Android-14-1080p-4K
        path: |
          dist/prayer-window-1080.png
          dist/prayer-window-4k.png
        if-no-files-found: error

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success() && github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.213
        name: OUSWIS 1.0.213
        body: |
          تحديث جديد لتطبيق Quswis tvOS Launcher من مستودعك:
          - إضافة مواقيت الصلاة
          - إضافة مباريات دوري أبطال آسيا للنخبة (AFC Champions League Elite)
        prerelease: false
        files: |
          dist/Quswis-tvOS-Launcher.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    - name: Publish updated prayer APK as a direct download
      if: github.ref == 'refs/heads/feature/prayer-glass-window'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: prayer-glass-reference-4k-r4
        target_commitish: ${{ github.sha }}
        name: Islamic Services - supplied reference design - 4K
        body: |
          إعادة تنفيذ نافذة الخدمات الإسلامية من حزمة التصميم المرجعي المرفقة.
          خلفية الحرم والمسجد وأيقونات مستقلة مع نصوص ومواقيت حية، والتحقق على 1080p و4K.
          إزالة عدسة القرآن من الرئيسية مع إبقاء القرآن والإذاعات داخل الخدمات الإسلامية.
          النسخة المستقرة محفوظة في backup/stable-1.0.205 وإصدار approved-v1.0.217.
          توقيع تطوير؛ قد لا يمكن تثبيته فوق نسخة موقعة بمفتاح مختلف.
        prerelease: true
        make_latest: false
        files: |
          dist/Quswis-tvOS-Launcher.apk
          dist/prayer-window-1080.png
          dist/prayer-window-4k.png
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

