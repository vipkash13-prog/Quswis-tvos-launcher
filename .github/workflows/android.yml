name: Android CI

on:
  push:
    branches: [ "main", "test-scene-glass-lens", "feature-classic-prayer-adhan", "feature/news-live-shortcuts" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # This project has no Gradle build: build.sh compiles it with the plain Android SDK tools.
    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        chmod +x build.sh
        VERSION_NAME="1.0.211-newslive" VERSION_CODE="211" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk

    - name: Test ADB cancellation
      run: |
        javac -cp build/classes -d build/classes tests/AdbGrantRequestTest.java tests/AdbGrantPlanTest.java tests/AdbAuthTest.java tests/HomeGeometryTest.java
        java -cp build/classes com.techgenius.tvoslauncher.AdbGrantRequestTest
        java -cp build/classes com.techgenius.tvoslauncher.AdbGrantPlanTest
        java -cp build/classes com.techgenius.tvoslauncher.AdbAuthTest
        java -cp build/classes com.techgenius.tvoslauncher.HomeGeometryTest

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-classic-prayer-adhan' || github.ref == 'refs/heads/feature/news-live-shortcuts')
      with:
        tag_name: news-live-v1.0.211-home-layout
        name: News Live 1.0.211 - Separate widget rail and app viewport
        body: |
          - تخصيص عمود ثابت للويدجتس ومنطقة مستقلة للتطبيقات دون تداخل
          - ضبط أحجام شبكة التطبيقات وصف التطبيقات وبطاقات متابعة المشاهدة حسب المساحة
          - تمرير التطبيقات الإضافية داخل مساحة محددة مع الحفاظ على جميع العناصر
          - الاحتفاظ بإصلاحات ADB والرجوع، الإصدار 1.0.211-newslive، رقم البناء 211
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        files: |
          dist/Quswis-tvOS-Launcher.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
