name: Android CI

on:
  push:
    branches: [ "main", "test-scene-glass-lens", "fix/xtream-playback-fallback-20261105" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # This project has no Gradle build: build.sh compiles it with the plain Android SDK tools.
    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        chmod +x build.sh
        VERSION_NAME="2.0.5" VERSION_CODE="205" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success() && github.ref == 'refs/heads/main'
      with:
        tag_name: v2.0.5
        name: Release v2.0.5
        body: |
          تحديث جديد لتطبيق Quswis tvOS Launcher من مستودعك:
          - إخفاء عناصر الرئيسية عند فتح القوائم والإعدادات وإعادتها عند الرجوع
        files: |
          dist/Quswis-tvOS-Launcher.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
