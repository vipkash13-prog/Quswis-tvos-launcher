name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android App
      run: |
        # البحث عن المجلد الذي يحتوي على build.gradle وبناء المشروع منه
        BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          تحديث جديد لتطبيق tvOS Launcher يضم:
          - إضافة مواقيت الصلاة
          - إضافة مباريات دوري أبطال آسيا للنخبة (AFC Champions League Elite)
        files: |
          **/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
