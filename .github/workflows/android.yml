name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build with Gradle
      run: |
        # البحث عن مكان ملف الإعدادات وبناء المشروع بناءً عليه
        if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
          gradle assembleDebug
        elif [ -d "app" ] && [ -f "app/build.gradle" ]; then
          gradle -p . assembleDebug
        else
          # إذا كان المشروع داخل مجلد فرعي، سنبحث عنه
          BUILD_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -maxdepth 3 | xargs dirname)
          if [ ! -z "$BUILD_DIR" ]; then
            cd "$BUILD_DIR"
            gradle assembleDebug
          else
            echo "Gradle project structure not found!"
            exit 1
          fi
        fi

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          تحديث جديد لتطبيق tvOS Launcher يضم:
          - إضافة مواقيت الصلاة
          - إضافة مباريات دوري أبطال آسيا للنخبة (AFC Champions League Elite)
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          **/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
