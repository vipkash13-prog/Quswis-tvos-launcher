name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare and Build Android App
      run: |
        # إنشاء ملف الإعدادات إذا لم يكن موجوداً لضمان نجاح البناء
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "Creating missing settings.gradle..."
          echo "include ':app'" > settings.gradle
        fi
        
        # إنشاء ملف Gradle Wrapper إذا كان مفقوداً
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          تحديث جديد لتطبيق tvOS Launcher يضم:
          - إضافة مواقيت الصلاة
          - إضافة مباريات دوري أبطال آسيا للنخبة (AFC Champions League Elite)
        files: |
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
