name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASS }}
      run: |
        chmod +x build.sh
        test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "Missing release signing secrets; refusing debug-signed release"; exit 1; }
        printf "%s" "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ouswis-release.jks"
        export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        RELEASE_KEYSTORE="$RUNNER_TEMP/ouswis-release.jks" RELEASE_KEYSTORE_PASS="$RELEASE_KEYSTORE_PASSWORD" VERSION_NAME="1.0.211" VERSION_CODE="211" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk
        test "$(stat -c%s dist/Quswis-tvOS-Launcher.apk)" -le 31457280 || { echo "APK exceeds 30 MiB target"; exit 1; }
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/Quswis-tvOS-Launcher.apk

    - name: Verify update compatibility against stable 1.0.208 APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, urllib.request
        repo = os.environ["GITHUB_REPOSITORY"]
        tag = "macos-icons-stable-2088"
        req = urllib.request.Request(
            f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
            headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json", "User-Agent": "ouswis-signature-check"})
        with urllib.request.urlopen(req) as response:
            release = json.load(response)
        apks = [a for a in release.get("assets", []) if a["name"].lower().endswith(".apk")]
        if not apks:
            raise SystemExit("No reference APK in stable 1.0.208 release; cannot prove signing compatibility")
        asset = apks[0]
        req = urllib.request.Request(asset["url"], headers={
            "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
            "Accept": "application/octet-stream", "User-Agent": "ouswis-signature-check"})
        with urllib.request.urlopen(req) as response, open("build/reference-208.apk", "wb") as out:
            import shutil
            shutil.copyfileobj(response, out)
        PY
        APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
        OLD_CERT="$("$APKSIGNER" verify --print-certs build/reference-208.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
        NEW_CERT="$("$APKSIGNER" verify --print-certs dist/Quswis-tvOS-Launcher.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
        test -n "$OLD_CERT" && test -n "$NEW_CERT" || { echo "Could not read signing certificate fingerprints"; exit 1; }
        test "$OLD_CERT" = "$NEW_CERT" || { echo "Signing certificate mismatch: update over 1.0.208 would fail"; exit 1; }
        echo "PASS: 1.0.211 and stable 1.0.208 APK use the same signing certificate"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success() && github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.211
        name: Release v1.0.211
        body: |
          تحديث جديد لتطبيق Ouswis tvOS Launcher:
          - تحديث الاسم والأيقونة الجديدة بالكامل
          - الحفاظ على كافة التعديلات والخلفيات والبيانات الحالية
          - دعم التثبيت الفوقي والتحديث التلقائي بسلاسة
        files: |
          dist/Quswis-tvOS-Launcher.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
