name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASS }}
      run: |
        chmod +x build.sh
        test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "Missing release signing secrets; refusing debug-signed release"; exit 1; }
        printf "%s" "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ouswis-release.jks"
        export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        RELEASE_KEYSTORE="$RUNNER_TEMP/ouswis-release.jks" RELEASE_KEYSTORE_PASS="$RELEASE_KEYSTORE_PASSWORD" VERSION_NAME="1.0.211" VERSION_CODE="211" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk
        test "$(stat -c%s dist/Quswis-tvOS-Launcher.apk)" -le 31457280 || { echo "APK exceeds 30 MiB target"; exit 1; }
        "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/Quswis-tvOS-Launcher.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: false # Hold public release until installed 1.0.208 signing certificate is verified
      with:
        tag_name: v1.0.211
        name: Release v1.0.211
        body: |
          تحديث جديد لتطبيق Ouswis tvOS Launcher:
          - تحديث الاسم والأيقونة الجديدة بالكامل
          - الحفاظ على كافة التعديلات والخلفيات والبيانات الحالية
          - دعم التثبيت الفوقي والتحديث التلقائي بسلاسة
        files: |
          dist/Quswis-tvOS-Launcher.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
