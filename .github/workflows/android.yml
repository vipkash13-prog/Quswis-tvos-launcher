name: Android CI

on:
  push:
    branches: [ "main", "test-scene-glass-lens", "feature-classic-prayer-adhan", "feature/news-live-shortcuts" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # This project has no Gradle build: build.sh compiles it with the plain Android SDK tools.
    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        chmod +x build.sh
        VERSION_NAME="1.0.213-newslive" VERSION_CODE="213" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk

    - name: Test ADB cancellation
      run: |
        javac -cp build/classes -d build/classes tests/AdbGrantRequestTest.java tests/AdbGrantPlanTest.java tests/AdbAuthTest.java tests/GridHeaderViewportTest.java
        java -cp build/classes com.techgenius.tvoslauncher.AdbGrantRequestTest
        java -cp build/classes com.techgenius.tvoslauncher.AdbGrantPlanTest
        java -cp build/classes com.techgenius.tvoslauncher.AdbAuthTest
        java -cp build/classes com.techgenius.tvoslauncher.GridHeaderViewportTest

    - name: Build Android UI test
      run: bash tests/android/build-test.sh

    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Test actual Android scrolling viewport
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        target: default
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1920x1080
        script: |
          adb install -r build/tvos-home.apk
          adb install -r build/ui-test.apk
          adb shell am instrument -w com.techgenius.tvoslauncher.uitest/com.techgenius.tvoslauncher.ViewportInstrumentation | tee build/ui-test-results.txt
          grep -q VIEWPORT_TEST_PASSED build/ui-test-results.txt
          adb pull /sdcard/Android/data/com.techgenius.tvoslauncher/files/viewport.png dist/viewport.png

    - name: Upload Android UI test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Android-viewport-test
        path: |
          dist/viewport.png
          build/ui-test-results.txt

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-classic-prayer-adhan' || github.ref == 'refs/heads/feature/news-live-shortcuts')
      with:
        tag_name: news-live-v1.0.213-real-viewport
        name: News Live 1.0.213 - Real Android viewport below widget header
        body: |
          - إبقاء التصميم الأصلي وأحجام التطبيقات وعرض الشبكة كما هي
          - جعل حاوية التمرير نفسها تبدأ أسفل العدسات بدلاً من قص الرسم فقط
          - اختبار الواجهة الفعلية داخل أندرويد قبل نشر APK
          - الإصدار 1.0.213-newslive، رقم البناء 213
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        files: |
          dist/Quswis-tvOS-Launcher.apk
          dist/viewport.png
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
