name: Android CI

on:
  push:
    branches: [ "main", "test-scene-glass-lens", "feature-classic-prayer-adhan" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # This project has no Gradle build: build.sh compiles it with the plain Android SDK tools.
    - name: Install Android SDK platform and build-tools
      run: |
        SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

    - name: Prepare licensed Makkah adhan audio
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
        mkdir -p assets
        curl --fail --location --retry 4 --retry-delay 4 --user-agent "QuswisLauncher/1.0 (Wikimedia attribution)" \
          "https://commons.wikimedia.org/wiki/Special:Redirect/file/Maghrib_Adhan_at_the_Masjid_al_Haram%2C_Mecca_-_25_Feb%2C_2012.webm" -o /tmp/makkah.webm
        ffmpeg -hide_banner -loglevel error -y -i /tmp/makkah.webm -vn -c:a aac -b:a 80k assets/adhan_makkah.m4a
        test -s assets/adhan_makkah.m4a
        ls -lh assets/adhan_makkah.m4a

    - name: Build APK
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        chmod +x build.sh
        VERSION_NAME="1.0.${{ github.run_number }}" VERSION_CODE="${{ github.run_number }}" ./build.sh
        mkdir -p dist
        cp build/tvos-home.apk dist/Quswis-tvOS-Launcher.apk
        ls -lh dist/Quswis-tvOS-Launcher.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quswis-tvOS-Launcher
        path: dist/Quswis-tvOS-Launcher.apk
        if-no-files-found: error

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature-classic-prayer-adhan')
      with:
        tag_name: ${{ github.ref == 'refs/heads/main' && format('v1.0.{0}', github.run_number) || format('prayer-test-v1.0.{0}', github.run_number) }}
        name: ${{ github.ref == 'refs/heads/main' && format('Release v1.0.{0}', github.run_number) || format('Prayer Test v1.0.{0}', github.run_number) }}
        body: |
          تحديث جديد لتطبيق Quswis tvOS Launcher من مستودعك:
          - إضافة مواقيت الصلاة
          - إضافة مباريات دوري أبطال آسيا للنخبة (AFC Champions League Elite)
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        files: |
          dist/Quswis-tvOS-Launcher.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
